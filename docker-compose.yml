services:
  payload:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        # APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    image: payload
    container_name: payload
    restart: unless-stopped
    command: sh -c "pnpm ${APP_CMD:-dev}"
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - sqlite_data:/app/data
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/home/node/.pnpm-store
      - ~/.aws:/home/node/.aws
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/app/data/xc2f.db

volumes:
  sqlite_data:
    name: xc2f_sqlite_dev_data
  pnpm_store:
  node_modules:
