services:
  payload:
    image: public.ecr.aws/umcai/xc2f/payload:latest
    # image: public.ecr.aws/umcai/xc2f/payload:dev-latest
    container_name: payload
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/xc2f.db
    env_file:
      - .env

volumes:
  sqlite_data:
    external: true
    name: xc2f_sqlite_data
