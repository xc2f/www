services:
  payload:
    image: public.ecr.aws/umcai/xc2f/payload:latest
    container_name: payload
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    environment:
      DATABASE_URL: file:/app/data/xc2f.db
    env_file:
      - .env
